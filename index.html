document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

k-800: #1E293B;\n  --ink-900: #0F172A;\n  --ink-950: #0A0E1A;\n\n  /* Red — marca \"Vigilancia Inteligente\". Escala derivada del logo oficial. */\n  --red-50:  #FEF2F3;\n  --red-100: #FCDADE;\n  --red-200: #F9B5BD;\n  --red-300: #F5848F;\n  --red-400: #EF4862;\n  --red-500: #E90528;  /* DEFAULT brand */\n  --red-600: #C70323;\n  --red-700: #A50219;\n  --red-800: #7E0114;\n  --red-900: #57010E;\n\n  /* Blue — ahora secundario/informativo (no es brand). Conservado para badges info,\n     indicadores de proceso, y links secundarios cuando rojo ya domina la pantalla. */\n  --blue-50:  #EFF6FF;\n  --blue-100: #DBEAFE;\n  --blue-200: #BFDBFE;\n  --blue-300: #93C5FD;\n  --blue-400: #60A5FA;\n  --blue-500: #3B82F6;\n  --blue-600: #2563EB;\n  --blue-700: #1D4ED8;\n  --blue-800: #1E40AF;\n  --blue-900: #1E3A8A;\n\n  /* Cyan — acento puntual, \"EN VIVO\", isotipo. */\n  --cyan-50:  #ECFEFF;\n  --cyan-100: #CFFAFE;\n  --cyan-200: #A5F3FC;\n  --cyan-300: #67E8F9;\n  --cyan-400: #22D3EE;  /* DEFAULT accent */\n  --cyan-500: #06B6D4;\n  --cyan-600: #0891B2;\n  --cyan-700: #0E7490;\n\n  /* Semánticos */\n  --green-50:  #ECFDF5;\n  --green-100: #D1FAE5;\n  --green-500: #10B981;\n  --green-600: #059669;\n  --green-700: #047857;\n\n  --amber-50:  #FFFBEB;\n  --amber-100: #FEF3C7;\n  --amber-500: #F59E0B;\n  --amber-600: #D97706;\n  --amber-700: #B45309;\n\n  /* Brand ink — slate del logo oficial. */\n  --brand-ink:        #2D3035;\n  --brand-ink-deeper: #1F2125;\n\n  /* Semantic danger reds (slightly distinct from brand red for state semantics). */\n  --semantic-red-50:  #FEF2F2;\n  --semantic-red-100: #FEE2E2;\n  --semantic-red-500: #EF4444;\n  --semantic-red-600: #DC2626;\n  --semantic-red-700: #B91C1C;\n\n  --white: #FFFFFF;\n  --black: #000000;\n}\n\n/* =============================================================================\n   2. SEMANTIC TOKENS — light mode (default)\n   ============================================================================= */\n:root,\n:root[data-theme=\"light\"] {\n  /* Backgrounds */\n  --bg-app:        var(--ink-50);     /* app shell */\n  --bg-card:       var(--white);      /* surfaces / cards */\n  --bg-1:          var(--white);      /* alias bg-card */\n  --bg-2:          var(--ink-50);     /* subtle alt rows, hover */\n  --bg-3:          var(--ink-100);    /* deeper alt */\n  --bg-inverse:    var(--ink-950);    /* dark sections inside light theme (nav rail, etc.) */\n\n  /* Foregrounds */\n  --fg-1:          var(--ink-900);    /* primary text */\n  --fg-2:          var(--ink-600);    /* secondary text, labels */\n  --fg-3:          var(--ink-500);    /* tertiary, hints, placeholders */\n  --fg-4:          var(--ink-400);    /* disabled / very subtle */\n  --fg-inverse:    var(--white);\n  --fg-on-brand:   var(--white);\n\n  /* Borders */\n  --border-1:      var(--ink-200);    /* default */\n  --border-2:      var(--ink-300);    /* hover / stronger */\n  --border-3:      var(--ink-100);    /* very subtle dividers */\n  --border-focus:  var(--brand);\n\n  /* Brand / interactive (red) */\n  --brand:         var(--red-500);\n  --brand-hover:   var(--red-600);\n  --brand-press:   var(--red-700);\n  --brand-subtle:  rgba(233, 5, 40, 0.08);\n  --brand-on:      var(--white);\n\n  --accent:        var(--cyan-400);\n  --accent-subtle: var(--cyan-50);\n  --accent-on:     var(--ink-950);\n\n  /* Semantic backgrounds (subtle) and accents */\n  --success:        var(--green-600);\n  --success-subtle: var(--green-50);\n  --success-fg:     var(--green-700);\n\n  --warning:        var(--amber-600);\n  --warning-subtle: var(--amber-50);\n  --warning-fg:     var(--amber-700);\n\n  --danger:         var(--semantic-red-600);\n  --danger-subtle:  var(--semantic-red-50);\n  --danger-fg:      var(--semantic-red-700);\n\n  --info:           var(--blue-600);\n  --info-subtle:    var(--blue-50);\n  --info-fg:        var(--blue-700);\n\n  /* Focus ring */\n  --ring:          0 0 0 3px rgba(233, 5, 40, 0.32);\n  --ring-danger:   0 0 0 3px rgba(239, 68, 68, 0.32);\n}\n\n/* =============================================================================\n   3. SEMANTIC TOKENS — dark mode\n   ============================================================================= */\n:root[data-theme=\"dark\"] {\n  --bg-app:        var(--ink-950);\n  --bg-card:       var(--ink-900);\n  --bg-1:          var(--ink-900);\n  --bg-2:          #131A2B;            /* between 900 and 800 */\n  --bg-3:          var(--ink-800);\n  --bg-inverse:    var(--white);\n\n  --fg-1:          #F1F5FB;\n  --fg-2:          #B8C2D1;\n  --fg-3:          #8A97AB;\n  --fg-4:          var(--ink-500);\n  --fg-inverse:    var(--ink-950);\n  --fg-on-brand:   var(--white);\n\n  --border-1:      #1F2A40;\n  --border-2:      #2A3651;\n  --border-3:      #182030;\n  --border-focus:  var(--red-400);\n\n  --brand:         var(--red-500);\n  --brand-hover:   var(--red-400);\n  --brand-press:   var(--red-300);\n  --brand-subtle:  rgba(233, 5, 40, 0.14);\n  --brand-on:      var(--white);\n\n  --accent:        var(--cyan-400);\n  --accent-subtle: rgba(34, 211, 238, 0.14);\n  --accent-on:     var(--ink-950);\n\n  --success:        var(--green-500);\n  --success-subtle: rgba(16, 185, 129, 0.16);\n  --success-fg:     #6EE7B7;\n\n  --warning:        var(--amber-500);\n  --warning-subtle: rgba(245, 158, 11, 0.16);\n  --warning-fg:     #FCD34D;\n\n  --danger:         var(--semantic-red-500);\n  --danger-subtle:  rgba(239, 68, 68, 0.16);\n  --danger-fg:      #FCA5A5;\n\n  --info:           var(--blue-400);\n  --info-subtle:    rgba(59, 130, 246, 0.16);\n  --info-fg:        var(--blue-300);\n\n  --ring:          0 0 0 3px rgba(233, 5, 40, 0.40);\n  --ring-danger:   0 0 0 3px rgba(248, 113, 113, 0.40);\n}\n\n/* =============================================================================\n   4. TYPOGRAPHY\n   ============================================================================= */\n:root {\n  /* Font stacks */\n  --font-sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;\n  --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace;\n  --font-display: var(--font-sans);\n\n  /* Size scale (px) */\n  --fs-12: 12px;\n  --fs-13: 13px;\n  --fs-14: 14px;\n  --fs-15: 15px;\n  --fs-16: 16px;\n  --fs-18: 18px;\n  --fs-20: 20px;\n  --fs-24: 24px;\n  --fs-30: 30px;\n  --fs-36: 36px;\n  --fs-48: 48px;\n  --fs-60: 60px;\n\n  /* Line heights */\n  --lh-tight:  1.15;\n  --lh-snug:   1.30;\n  --lh-normal: 1.50;\n  --lh-relaxed: 1.65;\n\n  /* Weights */\n  --fw-regular:  400;\n  --fw-medium:   500;\n  --fw-semibold: 600;\n  --fw-bold:     700;\n\n  /* Letter spacing */\n  --tracking-tight:  -0.02em;\n  --tracking-snug:   -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:    0.04em;\n  --tracking-wider:   0.08em;   /* labels en mayúsculas */\n}\n\n/* Semantic type roles */\n.t-display,\n.t-h1,\n.t-h2,\n.t-h3,\n.t-h4,\n.t-h5,\n.t-body,\n.t-body-sm,\n.t-caption,\n.t-overline,\n.t-mono,\n.t-mono-sm {\n  font-family: var(--font-sans);\n  color: var(--fg-1);\n}\n\n.t-display {\n  font-size: var(--fs-48);\n  line-height: var(--lh-tight);\n  font-weight: var(--fw-semibold);\n  letter-spacing: var(--tracking-tight);\n}\n\n.t-h1 {\n  font-size: var(--fs-36);\n  line-height: var(--lh-tight);\n  font-weight: var(--fw-semibold);\n  letter-spacing: var(--tracking-tight);\n}\n\n.t-h2 {\n  font-size: var(--fs-30);\n  line-height: var(--lh-snug);\n  font-weight: var(--fw-semibold);\n  letter-spacing: var(--tracking-snug);\n}\n\n.t-h3 {\n  font-size: var(--fs-24);\n  line-height: var(--lh-snug);\n  font-weight: var(--fw-semibold);\n  letter-spacing: var(--tracking-snug);\n}\n\n.t-h4 {\n  font-size: var(--fs-20);\n  line-height: var(--lh-snug);\n  font-weight: var(--fw-semibold);\n}\n\n.t-h5 {\n  font-size: var(--fs-16);\n  line-height: var(--lh-snug);\n  font-weight: var(--fw-semibold);\n}\n\n.t-body {\n  font-size: var(--fs-15);\n  line-height: var(--lh-normal);\n  font-weight: var(--fw-regular);\n  color: var(--fg-1);\n}\n\n.t-body-sm {\n  font-size: var(--fs-13);\n  line-height: var(--lh-normal);\n  font-weight: var(--fw-regular);\n  color: var(--fg-2);\n}\n\n.t-caption {\n  font-size: var(--fs-12);\n  line-height: var(--lh-normal);\n  font-weight: var(--fw-regular);\n  color: var(--fg-3);\n}\n\n.t-overline {\n  font-size: 11px;\n  line-height: 1.4;\n  font-weight: var(--fw-semibold);\n  letter-spacing: var(--tracking-wider);\n  text-transform: uppercase;\n  color: var(--fg-3);\n}\n\n.t-mono {\n  font-family: var(--font-mono);\n  font-size: var(--fs-14);\n  font-weight: var(--fw-medium);\n  letter-spacing: 0;\n}\n\n.t-mono-sm {\n  font-family: var(--font-mono);\n  font-size: var(--fs-12);\n  font-weight: var(--fw-medium);\n}\n\n/* =============================================================================\n   5. SPACING — scale 4px\n   ============================================================================= */\n:root {\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n}\n\n/* =============================================================================\n   6. RADII\n   ============================================================================= */\n:root {\n  --radius-none: 0;\n  --radius-sm:   6px;\n  --radius-md:   8px;\n  --radius-lg:   12px;\n  --radius-xl:   16px;\n  --radius-2xl:  24px;\n  --radius-full: 9999px;\n}\n\n/* =============================================================================\n   7. SHADOWS — elevation system\n   ============================================================================= */\n:root {\n  --shadow-1: 0 1px 2px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);\n  --shadow-2: 0 4px 12px rgba(15, 23, 42, 0.08), 0 2px 4px rgba(15, 23, 42, 0.04);\n  --shadow-3: 0 12px 32px rgba(15, 23, 42, 0.12), 0 4px 8px rgba(15, 23, 42, 0.06);\n  --shadow-4: 0 24px 48px rgba(15, 23, 42, 0.18), 0 8px 16px rgba(15, 23, 42, 0.08);\n  --shadow-inset: inset 0 1px 0 rgba(255, 255, 255, 0.06);\n}\n\n:root[data-theme=\"dark\"] {\n  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.50), 0 1px 3px rgba(0, 0, 0, 0.30);\n  --shadow-2: 0 4px 12px rgba(0, 0, 0, 0.55), 0 2px 4px rgba(0, 0, 0, 0.35);\n  --shadow-3: 0 12px 32px rgba(0, 0, 0, 0.60);\n  --shadow-4: 0 24px 48px rgba(0, 0, 0, 0.70), 0 8px 16px rgba(0, 0, 0, 0.40);\n}\n\n/* =============================================================================\n   8. MOTION\n   ============================================================================= */\n:root {\n  --ease-out:    cubic-bezier(0.16, 1, 0.30, 1);\n  --ease-in:     cubic-bezier(0.40, 0, 1, 1);\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);\n  --ease-linear: linear;\n\n  --dur-1: 80ms;   /* press */\n  --dur-2: 120ms;  /* hover */\n  --dur-3: 180ms;  /* focus, micro transitions */\n  --dur-4: 240ms;  /* overlay fade */\n  --dur-5: 320ms;  /* modal in */\n  --dur-6: 480ms;  /* page transition */\n}\n\n/* =============================================================================\n   9. Z-INDEX\n   ============================================================================= */\n:root {\n  --z-base:     0;\n  --z-elevated: 10;\n  --z-sticky:   100;\n  --z-overlay:  500;\n  --z-modal:    1000;\n  --z-toast:    1500;\n  --z-tooltip:  2000;\n}\n\n/* =============================================================================\n   10. RESET & DEFAULTS — minimal, opinionated\n   ============================================================================= */\n*, *::before, *::after { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; }\nbody {\n  font-family: var(--font-sans);\n  font-size: var(--fs-15);\n  line-height: var(--lh-normal);\n  color: var(--fg-1);\n  background: var(--bg-app);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n  font-feature-settings: 'cv11', 'ss01';\n}\n:focus-visible { outline: none; box-shadow: var(--ring); border-radius: var(--radius-sm); }\n<\u002Fstyle>\n<script src=\"98cb8c39-9424-49bc-9176-f965db11e993\"><\u002Fscript>\n<style>\n  html, body { height: 100%; }\n  body { background: var(--bg-app); }\n  a { color: var(--brand); text-decoration: none; }\n  a:hover { color: var(--brand-hover); text-decoration: underline; }\n  ::-webkit-scrollbar { width: 10px; height: 10px; }\n  ::-webkit-scrollbar-thumb { background: var(--ink-300); border-radius: 9999px; border: 3px solid var(--bg-app); }\n  input, select, button, textarea { font-family: var(--font-sans); font-size: 13px; }\n  @keyframes riseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }\n  @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"height:100vh;overflow:hidden;display:flex;background:var(--bg-app);color:var(--fg-1);font-family:var(--font-sans)\">\n\n  <aside style=\"width:252px;flex:0 0 252px;background:var(--ink-950);color:var(--fg-inverse);display:flex;flex-direction:column;position:sticky;top:0;height:100vh\">\n    <div style=\"padding:20px 20px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)\">\n      <div style=\"width:34px;height:34px;flex:0 0 34px;border-radius:8px;background:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:-.02em;color:#fff\">AD<\u002Fdiv>\n      <div style=\"min-width:0\">\n        <div style=\"font-size:14px;font-weight:600;letter-spacing:-.01em;color:#fff\">Agro Delta<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--ink-400)\">Gestión mayorista<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <nav style=\"padding:12px 10px;display:flex;fle :#fff;font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-1)\" style-hover=\"background:var(--brand-hover)\" style-active=\"transform:scale(.98)\">{{ modal.confirmLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toast.show }}\">\n    <div style=\"position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:1500;display:flex;align-items:center;gap:12px;padding:13px 18px;border-radius:10px;background:var(--ink-900);color:#fff;box-shadow:var(--shadow-3);animation:toastIn 240ms var(--ease-out)\">\n      <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--green-500)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n      <div>\n        <div style=\"font-size:13px;font-weight:600\">{{ toast.titulo }}<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--ink-300)\">{{ toast.sub }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:940}}\">\nclass Component extends DCLogic {\n  state = { db:null, rol:'gerente', device:'desktop', mod:'inicio', tab:0, sel:null, modal:null, toast:null, query:'', flow:null, step:0, mtab:0, seq:{} };\n\n  componentDidMount(){\n    const url = (window.__resources && window.__resources.datosERP) || './agrodelta-data.js';\n    import(url).then(m=>{\n      this.setState({ db: JSON.parse(JSON.stringify(m.default)) });\n    });\n  }\n\n  // ---------- helpers ----------\n  n2(v){ return (v||0).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}); }\n  usd(v){ return '$' + this.n2(v); }\n  bs(v){ const t=this.state.db?this.state.db.empresa.tasa:52.57; return 'Bs ' + this.n2((v||0)*t); }\n  k(v){ return v>=1000 ? '$'+(v/1000).toFixed(1).replace('.',',')+'K' : this.usd(v); }\n  T(titulo,sub){ this.setState({toast:{titulo,sub}}); clearTimeout(this._tt); this._tt=setTimeout(()=>this.setState({toast:null}),3400); }\n  hoy(){ return '26/08/2026'; }\n  dParse(s){ const p=(s||'').split('/'); return new Date(+p[2],+p[1]-1,+p[0]); }\n  diasVencido(s){ return Math.round((this.dParse(this.hoy()) - this.dParse(s))/86400000); }\n  next(pref,base){ const s={...this.state.seq}; s[pref]=(s[pref]||0)+1; this._seq=s; return pref+(base+s[pref]); }\n\n  tone(estado){\n    const m = {\n      'Cobrada':'ok','Aprobada':'ok','Despachado':'ok','Facturado':'ok','Recibida':'ok','Pagada':'ok',\n      'Pendiente':'warn','Por despachar':'warn','En tránsito':'info','Enviada':'info','Por aprobar':'warn',\n      'Parcial':'info','Recibida parcial':'info','Vencida':'bad','Borrador':'muted','Anulada':'muted'\n    };\n    const t = m[estado] || 'muted';\n    const map = {\n      ok:{bg:'var(--success-subtle)',fg:'var(--success-fg)'},\n      warn:{bg:'var(--warning-subtle)',fg:'var(--warning-fg)'},\n      info:{bg:'var(--info-subtle)',fg:'var(--info-fg)'},\n      bad:{bg:'var(--danger-subtle)',fg:'var(--danger-fg)'},\n      muted:{bg:'var(--bg-3)',fg:'var(--fg-2)'}\n    };\n    return map[t];\n  }\n  cell(t,o){ o=o||{}; return { t:t==null?'':String(t), sub:o.sub||'', align:o.align||'left', font:o.mono?'var(--font-mono)':'var(--font-sans)',\n    size:o.size||'13px', weight:o.weight||(o.strong?'600':'400'), color:o.color||'var(--fg-1)', isText:!o.badge, isBadge:!!o.badge,\n    bg:o.bg||'transparent', fg:o.fg||'var(--fg-1)' }; }\n  badgeCell(estado,align){ const t=this.tone(estado); return { t:estado, sub:'', align:align||'left', isBadge:true, isText:false, bg:t.bg, fg:t.fg, font:'var(--font-sans)', size:'13px', weight:'600', color:'var(--fg-1)' }; }\n\n  nav(mod){ this.setState({mod, tab:0, sel:null, query:''}); }\n  open(kind,id){ this.setState({sel:{kind,id}}); }\n\n  P(id){ return this.state.db.productos.find(p=>p.id===id); }\n  C(id){ return this.state.db.clientes.find(c=>c.id===id); }\n  saldo(f){ return Math.max(0, Math.round((f.total + (f.igtf||0) - (f.abonado||0))*100)/100); }\n  pendientes(){ return this.state.db.facturas.filter(f=>f.estado!=='Cobrada'); }\n\n  // ---------- mutations ----------\n  crearCotizacion(){\n    const m=this.state.modal; if(!m.items.length){ this.T('Cotización sin líneas','Agregue al menos un producto.'); return; }\n    const db=this.state.db; const cl=this.C(m.cliente);\n    const lineas=m.items.map(i=>{ const p=this.P(i.pid); return {pid:p.id,nombre:p.nombre,cant:i.cant,precio:p.precio,exento:p.exento,total:Math.round(i.cant*p.precio*100)/100}; });\n    const base=lineas.reduce((s,l)=>s+l.total,0);\n    const grav=lineas.filter(l=>!l.exento).reduce((s,l)=>s+l.total,0);\n    const doc={ id:'COT-2026-'+(220+db.cotizaciones.length), cliente:cl.id, clienteNombre:cl.nombre, fecha:this.hoy(), vence:'25/09/2026',\n      ruta:cl.ruta, estado:'Enviada', lineas, base:Math.round(base*100)/100, grav, exenta:Math.round((base-grav)*100)/100,\n      iva:Math.round(grav*0.16*100)/100, total:Math.round((base+grav*0.16)*100)/100 };\n    db.cotizaciones.unshift(doc);\n    this.setState({db, modal:null, mod:'ventas', tab:0, sel:{kind:'cot',id:doc.id}});\n    this.T('Cotización '+doc.id+' generada', cl.nombre + ' · ' + this.usd(doc.total));\n  }\n  aPedido(cot){\n    const db=this.state.db;\n    const ped={ id:'PED-2026-'+(1093+db.pedidos.length), cliente:cot.cliente, clienteNombre:cot.clienteNombre, fecha:this.hoy(), ruta:cot.ruta,\n      estado:'Por despachar', deposito:'Galpón principal · Puerto Ordaz', origen:cot.id, lineas:cot.lineas,\n      base:cot.base, grav:cot.grav, exenta:cot.exenta, iva:cot.iva, total:cot.total };\n    cot.estado='Aprobada'; db.pedidos.unshift(ped);\n    this.setState({db, mod:'ventas', tab:1, sel:{kind:'ped',id:ped.id}, flow:this.state.flow, step:this.state.flow==='venta'?1:this.state.step});\n    this.T('Pedido '+ped.id+' creado', 'Reservado en galpón principal.');\n  }\n  facturar(ped){\n    const db=this.state.db; const cl=this.C(ped.cliente);\n    const num='A-'+(4483+db.facturas.length);\n    const fac={ id:num, control:'00-'+(18935+db.facturas.length), cliente:ped.cliente, clienteNombre:ped.clienteNombre, rif:cl?cl.rif:'—',\n      fecha:this.hoy(), vencimiento:'25/09/2026', cond:cl?cl.cond:'Contado', ruta:ped.ruta, estado:'Pendiente', igtf:0,\n      lineas:ped.lineas, base:ped.base, grav:ped.grav, exenta:ped.exenta, iva:ped.iva, total:ped.total, abonado:0, forma:'—', origen:ped.id };\n    ped.estado='Facturado'; db.facturas.unshift(fac);\n    ped.lineas.forEach(l=>{ const p=this.P(l.pid); if(p){ p.exist=Math.max(0,p.exist-l.cant);\n      (db.kardexPorProducto[p.id]=db.kardexPorProducto[p.id]||[]).push({fecha:this.hoy(),doc:'Factura '+num,tipo:'salida',cant:-l.cant,saldo:p.exist}); } });\n    this.setState({db, mod:'facturacion', tab:0, sel:{kind:'fac',id:num}, step:this.state.flow==='venta'?2:this.state.step});\n    this.T('Factura '+num+' emitida','Inventario descargado · cuenta por cobrar abierta.');\n  }\n  modalCobro(fac){\n    this.setState({modal:{ tipo:'cobro', doc:fac.id, monto:String(Math.round(this.saldo(fac)*1.03*100)/100), forma:'Divisas en efectivo', ref:'', fecha:this.hoy() }});\n  }\n  registrarCobro(){\n    const m=this.state.modal; const db=this.state.db;\n    const fac=db.facturas.find(f=>f.id===m.doc); const monto=parseFloat(String(m.monto).replace(',','.'))||0;\n    fac.forma=m.forma;\n    // En divisas el IGTF del 3 % viene incluido en el monto recibido del cliente.\n    const igtf = m.forma==='Divisas en efectivo' ? Math.round((monto - monto/1.03)*100)/100 : 0;\n    fac.igtf=Math.round(((fac.igtf||0)+igtf)*100)/100;\n    fac.abonado=Math.round(((fac.abonado||0)+monto)*100)/100;\n    fac.estado = this.saldo(fac)<=0.02 ? 'Cobrada' : 'Pendiente';\n    this.setState({db, modal:null, step:this.state.flow==='venta'?3:this.state.step});\n    this.T('Cobro registrado', fac.id+' · '+this.usd(monto)+' · '+m.forma);\n  }\n  modalRecepcion(oc){\n    this.setState({modal:{ tipo:'recepcion', doc:oc.id, guia:'GD-'+(41200+oc.lineas.length), deposito:'Galpón principal · Puerto Ordaz',\n      items:oc.lineas.map(l=>({pid:l.pid,cant:l.cant,precio:l.precio})) }});\n  }\n  registrarRecepcion(){\n    const m=this.state.modal; const db=this.state.db; const oc=db.ordenes.find(o=>o.id===m.doc);\n    m.items.forEach(i=>{ const p=this.P(i.pid); if(p&&i.cant>0){ p.exist+=i.cant;\n      (db.kardexPorProducto[p.id]=db.kardexPorProducto[p.id]||[]).push({fecha:this.hoy(),doc:'Recepción '+oc.id,tipo:'entrada',cant:i.cant,saldo:p.exist}); } });\n    oc.estado='Recibida';\n    const total=m.items.reduce((s,i)=>s+i.cant*i.precio,0)*1.16;\n    if(!db.cxp.some(c=>c.oc===oc.id)){\n      db.cxp.unshift({ id:'CXP-'+(780+db.cxp.length), oc:oc.id, prov:oc.prov, provNombre:oc.provNombre, fecha:this.hoy(),\n        vencimiento:'25/09/2026', total:Math.round(total*100)/100, abonado:0, estado:'Pendiente' });\n    }\n    this.setState({db, modal:null, mod:'inventario', tab:0, sel:null, step:this.state.flow==='compra'?2:this.state.step});\n    this.T('Recepción conforme', oc.id+' · inventario actualizado y cuenta por pagar abierta.');\n  }\n  modalPago(c){ this.setState({modal:{ tipo:'pago', doc:c.id, monto:String(Math.round((c.total-(c.abonado||0))*100)/100), forma:'Transferencia Bs', ref:'', fecha:this.hoy() }}); }\n  registrarPago(){\n    const m=this.state.modal; const db=this.state.db; const c=db.cxp.find(x=>x.id===m.doc);\n    const monto=parseFloat(String(m.monto).replace(',','.'))||0;\n    c.abonado=Math.round(((c.abonado||0)+monto)*100)/100;\n    c.estado = c.abonado>=c.total-0.01 ? 'Pagada' : 'Parcial';\n    this.setState({db, modal:null, step:this.state.flow==='compra'?3:this.state.step});\n    this.T('Pago registrado', c.oc+' · '+this.usd(monto)+' · '+m.forma);\n  }\n  modalAjuste(p){ this.setState({modal:{ tipo:'ajuste', pid:p.id, conteo:String(p.exist), motivo:'Conteo físico', obs:'' }}); }\n  registrarAjuste(){\n    const m=this.state.modal; const db=this.state.db; const p=this.P(m.pid);\n    const nuevo=parseInt(m.conteo,10); const delta=nuevo-p.exist;\n    p.exist=nuevo; if(p.exist>p.min) p.flag=null;\n    (db.kardexPorProducto[p.id]=db.kardexPorProducto[p.id]||[]).push({fecha:this.hoy(),doc:m.motivo,tipo:'ajuste',cant:delta,saldo:nuevo});\n    this.setState({db, modal:null});\n    this.T('Inventario ajustado', p.nombre+' · '+(delta>=0?'+':'')+delta+' cajas');\n  }\n  modalOC(pid){\n    const db=this.state.db; const p=pid?this.P(pid):null;\n    this.setState({modal:{ tipo:'oc', prov:p?(db.proveedores.find(x=>x.nombre===p.lab)||db.proveedores[0]).id:db.proveedores[0].id,\n      entrega:'05/09/2026', items: p?[{pid:p.id,cant:24}]:[], picker:'' }});\n  }\n  crearOC(){\n    const m=this.state.modal; const db=this.state.db;\n    if(!m.items.length){ this.T('Orden sin líneas','Agregue al menos un producto.'); return; }\n    const pr=db.proveedores.find(x=>x.id===m.prov);\n    const lineas=m.items.map(i=>{ const p=this.P(i.pid); return {pid:p.id,nombre:p.nombre,cant:i.cant,precio:p.costo,exento:p.exento,total:Math.round(i.cant*p.costo*100)/100}; });\n    const base=Math.round(lineas.reduce((s,l)=>s+l.total,0)*100)/100;\n    const oc={ id:'OC-2026-'+(347+db.ordenes.length), prov:pr.id, provNombre:pr.nombre, fecha:this.hoy(), entrega:m.entrega,\n      estado:'Por aprobar', cond:pr.cond, lineas, base, iva:Math.round(base*0.16*100)/100, total:Math.round(base*1.16*100)/100 };\n    db.ordenes.unshift(oc);\n    this.setState({db, modal:null, mod:'compras', tab:0, sel:{kind:'oc',id:oc.id}, step:this.state.flow==='compra'?0:this.state.step});\n    this.T('Orden '+oc.id+' generada', pr.nombre+' · '+this.usd(oc.total));\n  }\n\n  // ---------- flow ----------\n  flowDef(){\n    const db=this.state.db;\n    if(this.state.flow==='venta') return {\n      titulo:'Ciclo de venta',\n      steps:['Cotización','Pedido','Factura','Cobro'],\n      hints:[\n        'Abra una coti dList();\n    L.onSearch=(e)=>this.setState({query:e.target.value});\n    L.query=S.query;\n    L.tabs=(L.tabs||[]).map((t,i)=>({ label:t, fn:()=>this.setState({tab:i,sel:null}), bg:S.tab===i?'var(--brand-subtle)':'transparent',\n      fg:S.tab===i?'var(--brand)':'var(--fg-2)', weight:S.tab===i?'600':'500' }));\n    out.list=L;\n\n    const acciones={ ventas:['Nueva cotización',()=>this.setState({modal:{tipo:'cot',cliente:db.clientes[0].id,items:[]}})],\n      facturacion:['Facturar pedido',()=>this.setState({mod:'ventas',tab:1,sel:null})],\n      compras:['Nueva orden de compra',()=>this.modalOC(null)],\n      inventario:['Ajustar inventario',()=>this.modalAjuste(db.productos[0])],\n      cxc:['Registrar cobro',()=>{const f=this.pendientes()[0]; if(f) this.modalCobro(f);}],\n      cxp:['Registrar pago',()=>{const c=db.cxp.find(x=>x.estado!=='Pagada'); if(c) this.modalPago(c);}] };\n    if(acciones[S.mod]) out.accion={show:true,label:acciones[S.mod][0],fn:acciones[S.mod][1]};\n    return out;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
